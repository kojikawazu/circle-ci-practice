services:
  postgres:
    image: postgres:16-alpine
    container_name: circle-ci-practice-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tasks
    ports:
      # ローカルで 5432 が他プロジェクトと衝突する場合は DB_PORT=5433 等で上書き可
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tasks"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
